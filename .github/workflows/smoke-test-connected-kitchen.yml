name: Smoke Test Connected Kitchen 1.20.1

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dedicated-server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated source package
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reassemble and patch the exact mod source
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            connected-kitchen-build/source.part00 \
            connected-kitchen-build/source.part01 \
            connected-kitchen-build/source.part02 \
            connected-kitchen-build/source.part03 \
            connected-kitchen-build/source.part04 \
            connected-kitchen-build/source.part05a \
            connected-kitchen-build/source.part05b0 \
            connected-kitchen-build/source.part05b1 \
            connected-kitchen-build/source.part05b2 \
            connected-kitchen-build/source.part05b3 \
            > connected-kitchen-source.b64
          base64 --decode connected-kitchen-source.b64 > connected-kitchen-source.zip
          echo "9c61ef20cdc16b992194bafce67e01e89bb4988200507127409922ca98dbc03d  connected-kitchen-source.zip" | sha256sum --check
          unzip -q connected-kitchen-source.zip
          sed -i '/disableRecompilation = true/d' connected-kitchen/build.gradle
          find connected-kitchen/src/main/java -name '*.java' -exec sed -i \
            -e '/import org.jetbrains.annotations.Nullable;/d' \
            -e '/^[[:space:]]*@Nullable$/d' {} +
          sed -i '/import net.minecraft.world.inventory.ChestMenu;/a import net.minecraft.world.inventory.MenuType;' \
            connected-kitchen/src/main/java/com/drcompress/connectedkitchen/blockentity/KitchenStoveBlockEntity.java
          sed -i 's@return ChestMenu.oneRow(containerId, playerInventory, this);@return new ChestMenu(MenuType.GENERIC_9x1, containerId, playerInventory, this, 1);@' \
            connected-kitchen/src/main/java/com/drcompress/connectedkitchen/blockentity/KitchenStoveBlockEntity.java
          sed -i 's@SoundEvents.UI_BUTTON_CLICK,@SoundEvents.UI_BUTTON_CLICK.value(),@' \
            connected-kitchen/src/main/java/com/drcompress/connectedkitchen/menu/RecipeCatalogContainer.java

      - name: Add the official NeoForge 1.20.1 Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-Forge-1.20.1-ModDevGradle.git /tmp/neoforge-mdk
          cp /tmp/neoforge-mdk/gradlew /tmp/neoforge-mdk/gradlew.bat connected-kitchen/
          mkdir -p connected-kitchen/gradle
          cp -R /tmp/neoforge-mdk/gradle/wrapper connected-kitchen/gradle/
          chmod +x connected-kitchen/gradlew

      - name: Compile the production mod JAR in this same job
        working-directory: connected-kitchen
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew build --stacktrace --no-daemon
          unzip -t build/libs/connectedkitchen-1.20.1-neoforge-1.0.0.jar
          sha256sum build/libs/connectedkitchen-1.20.1-neoforge-1.0.0.jar

      - name: Install a clean NeoForge 47.1.106 server
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p server
          curl --fail --location --retry 3 \
            https://maven.neoforged.net/releases/net/neoforged/forge/1.20.1-47.1.106/forge-1.20.1-47.1.106-installer.jar \
            --output server/neoforge-installer.jar
          cd server
          java -jar neoforge-installer.jar --installServer
          rm neoforge-installer.jar
          mkdir -p mods
          cp ../connected-kitchen/build/libs/connectedkitchen-1.20.1-neoforge-1.0.0.jar mods/
          unzip -t mods/connectedkitchen-1.20.1-neoforge-1.0.0.jar
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          level-name=smoke-world
          level-type=minecraft:flat
          generate-structures=false
          spawn-animals=false
          spawn-monsters=false
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          sync-chunk-writes=false
          EOF
          chmod +x run.sh

      - name: Start server and verify Connected Kitchen loads
        working-directory: server
        shell: bash
        run: |
          set -uo pipefail
          setsid ./run.sh nogui > smoke-server.log 2>&1 &
          server_pid=$!
          ready=0
          for second in $(seq 1 180); do
            if grep -q 'Done (' smoke-server.log logs/latest.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat smoke-server.log || true
          cat logs/latest.log || true

          loaded=0
          if grep -Rqi 'connectedkitchen' logs smoke-server.log 2>/dev/null; then
            loaded=1
          fi

          kill -INT -- "-$server_pid" 2>/dev/null || true
          sleep 5
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$server_pid" 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            echo 'NeoForge server did not reach the ready state.' >&2
            exit 1
          fi
          if [ "$loaded" -ne 1 ]; then
            echo 'Server started, but Connected Kitchen was not found in its logs.' >&2
            exit 1
          fi
          echo 'Connected Kitchen loaded successfully on a clean NeoForge 47.1.106 dedicated server.'

      - name: Upload the runtime-tested JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connected-kitchen-runtime-tested
          path: connected-kitchen/build/libs/connectedkitchen-1.20.1-neoforge-1.0.0.jar
          if-no-files-found: error

      - name: Upload server smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-kitchen-server-smoke-logs
          path: |
            server/smoke-server.log
            server/logs/latest.log
            server/logs/debug.log
          if-no-files-found: warn
